name: test formulae

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "npm/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "Formula/**"
      - "npm/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAP_NAME: erchoc/tap

jobs:
  style:
    name: brew style & audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Link repo as tap
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/erchoc/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: brew style
        run: brew style "$TAP_NAME"

      - name: brew audit
        run: brew audit --strict --online --tap "$TAP_NAME"

  install:
    name: brew install (${{ matrix.os }})
    needs: style
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Link repo as tap
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/erchoc/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: brew install & test each formula
        run: |
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "::group::install $name"
            brew install --formula "$TAP_NAME/$name"
            brew test --formula "$TAP_NAME/$name" || true
            echo "::endgroup::"
          done

  npm-scripts-lint:
    name: npm scripts syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check on all shared build scripts
        run: |
          set -euo pipefail
          for f in npm/scripts/*.mjs; do
            echo "::group::node --check $f"
            node --check "$f"
            echo "::endgroup::"
          done
