name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/vvpn \
            target/aarch64-apple-darwin/release/vvpn \
            -output vvpn
          chmod +x vvpn
          file vvpn

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar czf "vvpn-${VERSION}-darwin-universal.tar.gz" vvpn
          shasum -a 256 "vvpn-${VERSION}-darwin-universal.tar.gz" > sha256.txt
          cat sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "vvpn-${VERSION}-darwin-universal.tar.gz" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Update Homebrew Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA256=$(cat sha256.txt | awk '{print $1}')
          URL="https://github.com/Erchoc/homebrew-vvpn/releases/download/${GITHUB_REF_NAME}/vvpn-${VERSION}-darwin-universal.tar.gz"

          cat > Formula/vvpn.rb << FORMULA
          class Vvpn < Formula
            desc "Stash VPN 环境诊断工具"
            homepage "https://github.com/Erchoc/homebrew-vvpn"
            url "${URL}"
            sha256 "${SHA256}"
            version "${VERSION}"
            license "MIT"

            def install
              bin.install "vvpn"
            end

            test do
              assert_match "vvpn", shell_output("#{bin}/vvpn 2>&1", 0)
            end
          end
          FORMULA

          # Remove leading spaces from heredoc
          sed -i '' 's/^          //' Formula/vvpn.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout master
          git add Formula/vvpn.rb
          git commit -m "chore: update formula to v${VERSION}"
          git push
